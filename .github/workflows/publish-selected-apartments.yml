name: Publish selected apartments to Telegram

on:
  workflow_dispatch:
    inputs:
      urls:
        description: Public Lalafo detail URLs separated by whitespace
        required: true
        type: string
      confirm_public_send:
        description: I confirm sending these cards to the public Telegram group
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-apartments
  cancel-in-progress: false

jobs:
  publish-selected:
    if: inputs.confirm_public_send
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_ID: "-1004389602150"
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SELECTED_LALAFO_URLS: ${{ inputs.urls }}
      CONFIRM_SELECTED_PUBLIC_SEND: "true"
      DRY_RUN: "false"
      MAX_PHOTOS_PER_APARTMENT: "5"
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Select a working Lalafo route
        shell: bash
        run: |
          if python -m scripts.select_lalafo_proxy > lalafo-proxy.env; then
            cat lalafo-proxy.env >> "$GITHUB_ENV"
          else
            echo "::warning::No verified proxy was available; trying the direct route"
            echo "LALAFO_PROXY_URL=" >> "$GITHUB_ENV"
          fi
      - name: Upgrade database
        run: alembic upgrade head
      - name: Publish only the confirmed apartments
        run: python -m tools.publish_selected_apartments

