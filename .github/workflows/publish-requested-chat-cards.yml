name: Publish reviewed chat-only cards
on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
        required: true
      confirm_public_send:
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: publish-apartments
  cancel-in-progress: false
jobs:
  publish:
    if: inputs.confirm_public_send
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_ID: '-1004389602150'
      CHAT_CARD_MANIFEST: ${{ inputs.manifest }}
      CONFIRM_CHAT_CARD_PUBLIC_SEND: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tools.publish_requested_chat_cards
