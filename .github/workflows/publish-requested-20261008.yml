name: Diagnose and recover apartment publication
on:
  push:
    branches: [codex/publish-requested-20261008]
    paths: [.github/workflows/publish-requested-20261008.yml]
permissions:
  contents: read
concurrency:
  group: publish-apartments
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_ID: "-1004389602150"
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DRY_RUN: "false"
      RUN_BOT: "false"
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Diagnose queue and database
        run: |
          python - <<'PY'
          import asyncio,json
          from sqlalchemy import text
          from app.config import get_settings
          from app.database import create_engine_and_session
          async def main():
              e,s=create_engine_and_session(get_settings().database_url)
              async with e.connect() as c:
                  for label,sql in [
                      ("QUEUE", "select status,count(*) count,max(attempts) attempts from apartment_inventory_queue group by status"),
                      ("RECENT", "select lalafo_id,rooms,price,published_at,telegram_message_id from apartments where published_at is not null order by published_at desc limit 8"),
                      ("DUE", "select q.id,q.status,q.attempts,q.last_error,q.scheduled_at,a.lalafo_id,a.rooms,a.price,a.district,a.last_seen_at,a.source_url,a.photo_urls from apartment_inventory_queue q join apartments a on a.id=q.apartment_id where q.status in ('queued','publishing') order by q.scheduled_at limit 8"),
                      ("DISCOVERY", "select * from apartment_discovery_runs order by started_at desc limit 3")]:
                      try:
                          rows=(await c.execute(text(sql))).mappings().all()
                          print(label,json.dumps([dict(r) for r in rows],default=str,ensure_ascii=False))
                      except Exception as exc:
                          print(label,type(exc).__name__)
                          await c.rollback()
              await e.dispose()
          asyncio.run(main())
          PY
      - name: Dispatch one due apartment with current filters
        run: python -m scripts.publish_inventory
