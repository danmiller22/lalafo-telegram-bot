name: Publish three requested apartment cards October 10
on:
  push:
    branches: [codex/publish-requested-20261008]
    paths: [.github/workflows/publish-requested-20261008.yml]
permissions:
  contents: read
concurrency:
  group: requested-apartment-cards
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      TELEGRAM_BOT_USERNAME: arenda312bot
      SUPPORT_URL: https://t.me/rentttkg
      CONFIRM_SELECTED_PUBLIC_SEND: 'true'
      FORCE_SELECTED_REPOST: 'true'
      SELECTED_LALAFO_URLS: |
        https://lalafo.kg/bishkek/ads/1-komnata-rieltor-bez-zivotnyh-ot-1-mesaca-s-mebelu-polnostu-id-117145272
        https://lalafo.kg/bishkek/ads/vostok-5-mkr-id-116922177
        https://lalafo.kg/bishkek/ads/1-komnata-biskek-park-trc-agentstvo-nedvizimosti-bez-zivotnyh-ot-1-mesaca-ot-3-mesacev-ot-6-mesacev-s-mebelu-polnostu-id-117030136
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 97ad356f88832b28a24c12c2b0a08533a9cfb282
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Publish requested photo albums with contact buttons
        run: python -m tools.publish_selected_apartments
