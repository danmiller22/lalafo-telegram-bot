name: Publish requested apartment 114298231
on:
  push:
    branches: [codex/publish-requested-20261008]
    paths: [.github/workflows/publish-requested-20261008.yml]
permissions:
  contents: read
concurrency:
  group: publish-apartments
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      TELEGRAM_GROUP_ID: '-1004389602150'
      TELEGRAM_BOT_USERNAME: arenda312bot
      DRY_RUN: 'false'
      TEST_MODE: 'false'
      CONFIRM_SELECTED_PUBLIC_SEND: 'true'
      FORCE_SELECTED_REPOST: 'false'
      HTTP_TIMEOUT_SECONDS: '15'
      HTTP_MAX_RETRIES: '1'
      SELECTED_LALAFO_URLS: https://lalafo.kg/bishkek/ads/1-komnata-rieltor-s-mebelu-polnostu-id-114298231
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 626ebaa1553dc88d281ee645b033c754c3b5444b
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Select a working Lalafo route
        shell: bash
        run: |
          if timeout 60 python -m scripts.select_lalafo_proxy > lalafo-proxy.env; then
            cat lalafo-proxy.env >> "$GITHUB_ENV"
          fi
      - name: Publish requested card
        run: python -m tools.publish_selected_apartments
