name: Publish browser verified Vostok 5 apartment 114862425
on:
  push:
    branches: [codex/publish-requested-20261008]
    paths: [.github/workflows/publish-requested-20261008.yml]
permissions:
  contents: read
concurrency:
  group: requested-apartment-cards
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_ID: "-1004389602150"
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      TELEGRAM_BOT_USERNAME: arenda312bot
      CONFIRM_SELECTED_PUBLIC_SEND: 'true'
      FORCE_SELECTED_REPOST: 'true'
      SELECTED_LALAFO_URLS: |
        https://lalafo.kg/bishkek/ads/vostok-5-mkr-id-114862425
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c22bb57b368f2fbf7b8494d50b80d899f513735f
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Publish requested photo albums with contact buttons
        run: |
          python - <<'PY'
          import asyncio, json
          from app.config import get_settings
          from app.database import create_engine_and_session, init_db
          from app.lalafo.models import LalafoAd
          from app.payments.repository import ApartmentRepository
          async def seed():
              engine, sessions = create_engine_and_session(get_settings().database_url)
              try:
                  await init_db(engine)
                  ad = LalafoAd.model_validate(json.loads("{\"lalafo_id\":114862425,\"source_url\":\"https://lalafo.kg/bishkek/ads/vostok-5-mkr-id-114862425\",\"phone\":\"+996708516601\",\"phone_source_version\":2,\"price\":30000,\"currency\":\"KGS\",\"rooms\":\"1\",\"district\":\"Восток-5\",\"city\":\"Бишкек\",\"deposit\":null,\"photo_urls\":[\"https://img5.lalafo.com/i/posters/original/5f/a2/f8/62120e26e993bb1a1951382cdd.jpeg\",\"https://img5.lalafo.com/i/posters/original/cf/53/d9/1af3e602108d3dacaeb5219288.jpeg\",\"https://img5.lalafo.com/i/posters/original/63/89/fd/6c274de062577ca74f0d468c91.jpeg\",\"https://img5.lalafo.com/i/posters/original/17/ea/62/0fe6b1a3f0f641f7a409f48817.jpeg\"],\"category_id\":2044,\"no_subletting\":false,\"owner_listing\":false,\"seller_type\":\"agent\",\"source_title\":\"Восток-5 мкр Сдается 1х ком квартира\",\"source_description\":\"Восток-5 мкр. Сдается 1х ком квартира. Этаж: 7. Старый ремонт. С мебелью частично. Балкон. Электричество. Плита электрическая. Совмещённый санузел. Квартира на продаже. Цена: 30000.\"}"))
                  apartment = await ApartmentRepository(sessions).upsert_discovered(ad)
                  print(f"BROWSER_VERIFIED_SAVED lalafo_id={ad.lalafo_id} apartment_id={apartment.id} photos={len(ad.photo_urls)}")
              finally:
                  await engine.dispose()
          asyncio.run(seed())
          PY
          python -m tools.publish_selected_apartments
