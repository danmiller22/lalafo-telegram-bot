name: Publish requested Vostok 5 apartment 114862425
on:
  push:
    branches: [codex/publish-requested-20261008]
    paths: [.github/workflows/publish-requested-20261008.yml]
permissions:
  contents: read
concurrency:
  group: requested-apartment-cards
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_ID: "-1004389602150"
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      TELEGRAM_BOT_USERNAME: arenda312bot
      CONFIRM_SELECTED_PUBLIC_SEND: 'true'
      FORCE_SELECTED_REPOST: 'true'
      SELECTED_LALAFO_URLS: |
        https://lalafo.kg/bishkek/ads/vostok-5-mkr-id-114862425
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c22bb57b368f2fbf7b8494d50b80d899f513735f
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Publish requested photo albums with contact buttons
        run: python -m tools.publish_selected_apartments
