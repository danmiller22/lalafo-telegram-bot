name: Publish eight user-requested apartments
on:
  push:
    branches: [codex/publish-requested-20261008]
    paths: [.github/workflows/publish-requested-20261008.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      PAYMENT_ADMIN_USER_ID: ${{ secrets.PAYMENT_ADMIN_USER_ID }}
      PAYMENT_CALLBACK_SECRET: ${{ secrets.PAYMENT_CALLBACK_SECRET }}
      TELEGRAM_GROUP_ID: '-1004389602150'
      TELEGRAM_BOT_USERNAME: arenda312bot
      DRY_RUN: 'false'
      TEST_MODE: 'false'
      CONFIRM_SELECTED_PUBLIC_SEND: 'true'
      FORCE_SELECTED_REPOST: 'true'
      HTTP_TIMEOUT_SECONDS: '15'
      HTTP_MAX_RETRIES: '1'
      SELECTED_LALAFO_URLS: |
        https://lalafo.kg/bishkek/ads/sdaetsa-svetlaa-studia-s-otdelnoj-id-117132106
        https://lalafo.kg/bishkek/ads/1-komnata-cum-rieltor-semejnym-ot-3-mesacev-s-mebelu-polnostu-id-117127799
        https://lalafo.kg/bishkek/ads/vostok-5-mkr-id-116922177
        https://lalafo.kg/bishkek/ads/1-komnata-biskek-park-trc-agentstvo-nedvizimosti-bez-zivotnyh-ot-1-mesaca-ot-3-mesacev-ot-6-mesacev-s-mebelu-casticno-id-117038600
        https://lalafo.kg/bishkek/ads/1-komnata-knu-agentstvo-nedvizimosti-mozno-s-zivotnymi-s-mebelu-casticno-id-116992102
        https://lalafo.kg/bishkek/ads/1-komnata-vostok-5-mkr-agentstvo-nedvizimosti-bez-zivotnyh-ot-1-mesaca-ot-3-mesacev-ot-6-mesacev-s-mebelu-polnostu-id-116966410
        https://lalafo.kg/bishkek/ads/1-komnata-biskek-park-trc-agentstvo-nedvizimosti-bez-zivotnyh-ot-1-mesaca-ot-3-mesacev-ot-6-mesacev-s-mebelu-casticno-id-116953396
        https://lalafo.kg/bishkek/ads/1-komnata-zolotoj-kvadrat-agentstvo-nedvizimosti-bez-zivotnyh-ot-1-mesaca-ot-3-mesacev-ot-6-mesacev-s-mebelu-casticno-id-115029271
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - name: Publish exactly the eight requested cards
        run: python -m tools.publish_selected_apartments
