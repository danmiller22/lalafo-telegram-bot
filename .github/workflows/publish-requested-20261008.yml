name: Publish requested Vostok 5 apartment 117193159
on:
  push:
    branches: [codex/publish-requested-20261008]
    paths: [.github/workflows/publish-requested-20261008.yml]
permissions:
  contents: read
concurrency:
  group: publish-apartments
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_ID: "-1004389602150"
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      TELEGRAM_BOT_USERNAME: arenda312bot
      CONFIRM_SELECTED_PUBLIC_SEND: 'true'
      FORCE_SELECTED_REPOST: 'false'
      DRY_RUN: 'false'
      SELECTED_LALAFO_URLS: |
        https://lalafo.kg/bishkek/ads/1-komnata-vostok-5-mkr-bez-zivotnyh-s-mebelu-casticno-id-117193159
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c9c6da0ae6c153a7407534ac62f0989bcd843310
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Verify destination and save observed public source
        run: |
          python - <<'PY'
          import asyncio, json
          from aiogram import Bot
          from app.config import get_settings
          from app.database import create_engine_and_session, init_db
          from app.lalafo.models import LalafoAd
          from app.payments.repository import ApartmentRepository
          async def seed():
              settings = get_settings()
              bot = Bot(token=settings.require_bot_token())
              engine, sessions = create_engine_and_session(settings.database_url)
              try:
                  chat = await bot.get_chat(settings.telegram_group_id)
                  assert chat.username == "rentkg312", "Unexpected destination"
                  print(f"DESTINATION_VERIFIED username={chat.username} chat_id={chat.id}")
                  await init_db(engine)
                  ad = LalafoAd.model_validate(json.loads('{"lalafo_id":117193159,"source_url":"https://lalafo.kg/bishkek/ads/1-komnata-vostok-5-mkr-bez-zivotnyh-s-mebelu-casticno-id-117193159","phone":"+996708145617","phone_source_version":2,"price":30000,"currency":"KGS","rooms":"1","district":"Восток-5 мкр","city":"Бишкек","deposit":null,"photo_urls":["https://img5.lalafo.com/i/posters/original/9a/07/ae/d173a73e262ba5038dd2b51290.jpeg","https://img5.lalafo.com/i/posters/original/f2/40/a2/280b3d4922909bf6fde34932f3.jpeg","https://img5.lalafo.com/i/posters/original/3d/a5/8d/65efbddd7c2b9c9676567968aa.jpeg","https://img5.lalafo.com/i/posters/original/ec/0d/7b/f10f5fd2af63b3e53b7f7948b2.jpeg"],"category_id":2044,"no_subletting":true,"owner_listing":false,"seller_type":"realtor","source_title":"1 комната, Восток-5 мкр Без животных, С мебелью частично","source_description":"Восток 5мкр \\n1комнатная \\n30000","source_params":[],"source_created_at":"2026-10-11T05:24:13Z","source_updated_at":"2026-10-11T05:27:46Z"}'))
                  repository = ApartmentRepository(sessions)
                  published = await repository.published_lalafo_ids([ad.lalafo_id])
                  print(f"PUBLICATION_PREFLIGHT lalafo_id={ad.lalafo_id} already_published={ad.lalafo_id in published}")
                  if ad.lalafo_id not in published:
                      apartment = await repository.upsert_discovered(ad)
                      print(f"OBSERVED_SOURCE_SAVED lalafo_id={ad.lalafo_id} apartment_id={apartment.id} photos={len(ad.photo_urls)}")
              finally:
                  await bot.session.close()
                  await engine.dispose()
          asyncio.run(seed())
          PY
      - name: Publish requested photos and standard buttons without forcing a repost
        run: |
          python - <<'PY'
          import asyncio, json
          from tools import publish_selected_apartments as selected
          class VerifiedPublisher(selected.TelegramPublisher):
              async def publish(self, apartment_id, ad):
                  message = await super().publish(apartment_id, ad)
                  print("TELEGRAM_CARD_CONFIRMED " + json.dumps({
                      "lalafo_id": ad.lalafo_id,
                      "message_id": message.message_id,
                      "chat_id": message.chat.id,
                      "text": message.text,
                      "photos": len(ad.photo_urls),
                      "buttons": message.reply_markup.model_dump(mode="json") if message.reply_markup else None,
                  }, ensure_ascii=False))
                  return message
          selected.TelegramPublisher = VerifiedPublisher
          raise SystemExit(asyncio.run(selected.run()))
          PY
      - name: Verify saved publication
        run: |
          python - <<'PY'
          import asyncio
          from app.config import get_settings
          from app.database import create_engine_and_session
          from app.payments.repository import ApartmentRepository
          async def verify():
              engine, sessions = create_engine_and_session(get_settings().database_url)
              try:
                  apartment = await ApartmentRepository(sessions).get_by_lalafo(117193159)
                  assert apartment is not None and apartment.telegram_message_id
                  assert apartment.telegram_chat_id == -1004389602150
                  assert len(apartment.photo_urls) == 4
                  print(f"PUBLICATION_VERIFIED lalafo_id={apartment.lalafo_id} apartment_id={apartment.id} photos={len(apartment.photo_urls)} url=https://t.me/rentkg312/{apartment.telegram_message_id}")
              finally:
                  await engine.dispose()
          asyncio.run(verify())
          PY
