name: Release proven stale discovery lease and cool down failed photos
on:
  push:
    branches: [codex/publish-requested-20261008]
    paths: [.github/workflows/publish-requested-20261008.yml]
permissions:
  contents: read
concurrency:
  group: repair-stale-publication-state-20261008
  cancel-in-progress: false
jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
      TELEGRAM_GROUP_ID: "-1004389602150"
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DRY_RUN: "false"
      RUN_BOT: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Repair only known stale worker and repeatedly failed photo rows
        run: |
          python - <<'PY'
          import asyncio
          from datetime import datetime, timezone, timedelta
          from sqlalchemy import select
          from app.config import get_settings
          from app.database import create_engine_and_session
          from app.inventory import InventoryRepository
          from app.models import ApartmentDiscoveryRun, ApartmentInventoryQueue
          
          async def main():
              engine,sessions=create_engine_and_session(get_settings().database_url)
              inventory=InventoryRepository(sessions)
              try:
                  async with sessions.begin() as session:
                      row=await session.get(ApartmentDiscoveryRun,"2026-10-08T05:00+06",with_for_update=True)
                      expected=datetime.fromisoformat("2026-10-08T05:39:15.761921+00:00")
                      if row and row.status=="running" and row.started_at==expected:
                          row.status="failed"
                          row.lease_until=None
                          row.completed_at=datetime.now(timezone.utc)-timedelta(minutes=6)
                          row.last_error="RecoveredAfterDeploymentRestart"
                          print("STALE_LEASE_RELEASED",flush=True)
                      else:
                          print("STALE_LEASE_UNCHANGED newer_or_finished_run",flush=True)
                  for qid in (6719,6706):
                      async with sessions() as session:
                          row=await session.get(ApartmentInventoryQueue,qid)
                          eligible=bool(row and row.status=="queued" and row.attempts>=3 and row.last_error=="TelegramPublishError")
                      if eligible:
                          await inventory.retry_item(qid,error="TelegramPublishError")
                          print(f"PHOTO_COOLDOWN queue={qid}",flush=True)
                  async with sessions() as session:
                      row=await session.get(ApartmentDiscoveryRun,"2026-10-08T05:00+06")
                      print(f"DISCOVERY_VERIFIED status={row.status} started={row.started_at} lease={row.lease_until}",flush=True)
              finally:
                  await engine.dispose()
          asyncio.run(main())
          PY
