name: Publish requested Philharmonia apartment 115356055
on:
  push:
    branches: [codex/publish-requested-20261008]
    paths: [.github/workflows/publish-requested-20261008.yml]
permissions:
  contents: read
concurrency:
  group: publish-apartments
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_ID: "-1004389602150"
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      TELEGRAM_BOT_USERNAME: arenda312bot
      CONFIRM_SELECTED_PUBLIC_SEND: 'true'
      FORCE_SELECTED_REPOST: 'false'
      DRY_RUN: 'false'
      SELECTED_LALAFO_URLS: |
        https://lalafo.kg/bishkek/ads/1-komnata-filarmonia-rieltor-semejnym-ot-6-mesacev-s-mebelu-polnostu-id-115356055
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c9c6da0ae6c153a7407534ac62f0989bcd843310
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Verify destination and save observed public source
        run: |
          python - <<'PY'
          import asyncio, json
          from aiogram import Bot
          from app.config import get_settings
          from app.database import create_engine_and_session, init_db
          from app.lalafo.models import LalafoAd
          from app.payments.repository import ApartmentRepository
          async def seed():
              settings = get_settings()
              bot = Bot(token=settings.require_bot_token())
              engine, sessions = create_engine_and_session(settings.database_url)
              try:
                  chat = await bot.get_chat(settings.telegram_group_id)
                  assert chat.username == "rentkg312", "Unexpected destination"
                  print(f"DESTINATION_VERIFIED username={chat.username} chat_id={chat.id}")
                  await init_db(engine)
                  ad = LalafoAd.model_validate(json.loads('{"lalafo_id":115356055,"source_url":"https://lalafo.kg/bishkek/ads/1-komnata-filarmonia-rieltor-semejnym-ot-6-mesacev-s-mebelu-polnostu-id-115356055","phone":"+996778060203","phone_source_version":2,"price":30000,"currency":"KGS","rooms":"1","district":"Филармония","city":"Бишкек","deposit":5000,"photo_urls":["https://img5.lalafo.com/i/posters/original/2c/c2/14/eecf4347086f1b9b34e46f8ad9.jpeg","https://img5.lalafo.com/i/posters/original/63/1d/9c/9523ab980ad63e8ef1933c8b6c.jpeg","https://img5.lalafo.com/i/posters/original/7e/f9/8e/34b07746cd6672855d4964f9a2.jpeg","https://img5.lalafo.com/i/posters/original/4e/24/01/3181c72183208ca1a788f15ce2.jpeg","https://img5.lalafo.com/i/posters/original/26/dd/c8/1ab5bca095a9a9b00a677b56d7.jpeg","https://img5.lalafo.com/i/posters/original/be/b6/c3/8c7061e5f32006a908dc42ce27.jpeg"],"category_id":2044,"no_subletting":true,"owner_listing":false,"seller_type":"realtor","source_title":"1 комната, Филармония Риэлтор, Без животных, от 6 месяцев, С мебелью полностью","source_description":"Сдаётся уютная 1‑комнатная квартира с отдельной кухней.\\nпо адресу: Киев161\\n\\n- Просторная комната: двуспальная кровать с матрасом, тумба под ТВ, телевизор, стеллаж, плотные шторы, ковёр.\\n- Кухня гарнитурного типа: верхние и нижние шкафы, рабочая поверхность, круглая мойка, вытяжка, варочная панель на 2 конфорки (газ), холодильник Indesit. \\n- Обеденная зона: стол с лавкой у окна.\\n- Окна с тюлем и плотными портьерами, высокие потолки с точечным освещением.\\n- Отделка в светлых тонах, ламинат по полу.\\n\\nИдеально для одного или пары: всё необходимое для проживания и готовки уже на месте.","source_params":[],"source_created_at":"2026-10-11T03:22:32Z","source_updated_at":"2026-10-11T03:38:24Z"}'))
                  repository = ApartmentRepository(sessions)
                  published = await repository.published_lalafo_ids([ad.lalafo_id])
                  print(f"PUBLICATION_PREFLIGHT lalafo_id={ad.lalafo_id} already_published={ad.lalafo_id in published}")
                  if ad.lalafo_id not in published:
                      apartment = await repository.upsert_discovered(ad)
                      print(f"OBSERVED_SOURCE_SAVED lalafo_id={ad.lalafo_id} apartment_id={apartment.id} photos={len(ad.photo_urls)}")
              finally:
                  await bot.session.close()
                  await engine.dispose()
          asyncio.run(seed())
          PY
      - name: Publish requested photos and standard buttons without forcing a repost
        run: |
          python - <<'PY'
          import asyncio, json
          from tools import publish_selected_apartments as selected
          class VerifiedPublisher(selected.TelegramPublisher):
              async def publish(self, apartment_id, ad):
                  message = await super().publish(apartment_id, ad)
                  print("TELEGRAM_CARD_CONFIRMED " + json.dumps({
                      "lalafo_id": ad.lalafo_id,
                      "message_id": message.message_id,
                      "chat_id": message.chat.id,
                      "text": message.text,
                      "photos": len(ad.photo_urls),
                      "buttons": message.reply_markup.model_dump(mode="json") if message.reply_markup else None,
                  }, ensure_ascii=False))
                  return message
          selected.TelegramPublisher = VerifiedPublisher
          raise SystemExit(asyncio.run(selected.run()))
          PY
      - name: Verify saved publication
        run: |
          python - <<'PY'
          import asyncio
          from app.config import get_settings
          from app.database import create_engine_and_session
          from app.payments.repository import ApartmentRepository
          async def verify():
              engine, sessions = create_engine_and_session(get_settings().database_url)
              try:
                  apartment = await ApartmentRepository(sessions).get_by_lalafo(115356055)
                  assert apartment is not None and apartment.telegram_message_id
                  assert apartment.telegram_chat_id == -1004389602150
                  assert len(apartment.photo_urls) == 6
                  print(f"PUBLICATION_VERIFIED lalafo_id={apartment.lalafo_id} apartment_id={apartment.id} photos={len(apartment.photo_urls)} url=https://t.me/rentkg312/{apartment.telegram_message_id}")
              finally:
                  await engine.dispose()
          asyncio.run(verify())
          PY
