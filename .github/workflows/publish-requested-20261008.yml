name: Grant three explicitly approved weekly accesses
on:
  push:
    branches: [codex/publish-requested-20261008]
    paths: [.github/workflows/publish-requested-20261008.yml]
permissions:
  contents: read
concurrency:
  group: grant-three-weekly-accesses-20261008
  cancel-in-progress: false
jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
      TELEGRAM_GROUP_ID: "-1004389602150"
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DRY_RUN: "false"
      RUN_BOT: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Approve exact requests and verify weekly access
        run: |
          python - <<'PY'
          import asyncio
          from datetime import datetime, timezone, timedelta
          from aiogram import Bot
          from app.config import get_settings
          from app.database import create_engine_and_session
          from app.payments.repository import ApartmentRepository, PaymentRepository
          from app.payments.service import PaymentService
          from app.telegram.private_delivery import send_private_contact
          
          async def main():
              settings=get_settings()
              assert settings.admin_user_id > 0, "Configured administrator is required"
              engine,sessions=create_engine_and_session(settings.database_url)
              repo=PaymentRepository(sessions)
              service=PaymentService(ApartmentRepository(sessions),repo,admin_user_id=settings.admin_user_id)
              expected={1437:1465072578,1438:7863718792,1439:8898912697}
              for rid,uid in expected.items():
                  request=await repo.get_request(rid)
                  assert request and request.telegram_user_id == uid and request.plan == "week", f"Identity or plan mismatch: {rid}"
                  assert request.status in {"pending","approved"}, f"Unexpected status for {rid}: {request.status}"
              bot=Bot(settings.telegram_bot_token)
              try:
                  for rid,uid in expected.items():
                      outcome=await service.decide(rid,approve=True,actor_id=settings.admin_user_id)
                      assert outcome in {"approved","already_approved"}, f"Approval failed: {rid} {outcome}"
                      request=await repo.get_request(rid)
                      active=await repo.active_weekly_access(uid)
                      assert request.status == "approved" and active, f"Access verification failed: {rid}"
                      expires=request.access_expires_at
                      assert expires and expires > datetime.now(timezone.utc), f"Expired access: {rid}"
                      assert timedelta(days=6,hours=23) <= expires-request.approved_at <= timedelta(days=7,minutes=1), f"Unexpected duration: {rid}"
                      print(f"ACCESS_VERIFIED request={rid} user={uid} outcome={outcome} expires={expires.isoformat()}",flush=True)
                      if outcome == "approved":
                          try:
                              await bot.send_message(uid,"Оплата подтверждена. Доступ к контактам открыт.")
                              if request.apartment:
                                  await send_private_contact(bot,user_id=uid,apartment=request.apartment,support_url=settings.support_bot_url,max_photos=settings.max_photos_per_apartment)
                              if request.admin_message_id:
                                  await bot.edit_message_reply_markup(chat_id=settings.admin_user_id,message_id=request.admin_message_id,reply_markup=None)
                              print(f"NOTIFIED request={rid}",flush=True)
                          except Exception as exc:
                              print(f"NOTIFICATION_FAILED request={rid} error={type(exc).__name__}",flush=True)
              finally:
                  await bot.session.close()
                  await engine.dispose()
          asyncio.run(main())
          PY
