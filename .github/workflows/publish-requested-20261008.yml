name: Publish requested Asia Mall apartment
on:
  push:
    branches: [codex/publish-requested-20261008]
    paths: [.github/workflows/publish-requested-20261008.yml]
permissions:
  contents: read
concurrency:
  group: publish-apartments
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_ID: "-1004389602150"
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SELECTED_LALAFO_URLS: "https://lalafo.kg/bishkek/ads/1-komnata-azia-moll-rieltor-bez-zivotnyh-ot-1-mesaca-s-mebelu-polnostu-id-117112502"
      CONFIRM_SELECTED_PUBLIC_SEND: "true"
      FORCE_SELECTED_REPOST: "true"
      DRY_RUN: "false"
      RUN_BOT: "false"
      MAX_PHOTOS_PER_APARTMENT: "5"
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Select working Lalafo route
        timeout-minutes: 3
        shell: bash
        run: |
          if python -m scripts.select_lalafo_proxy > lalafo-proxy.env; then
            cat lalafo-proxy.env >> "$GITHUB_ENV"
          else
            echo "::warning::Route selection unavailable; trying configured direct route"
            echo "LALAFO_PROXY_URL=" >> "$GITHUB_ENV"
          fi
      - name: Publish only requested apartment
        run: python -m tools.publish_selected_apartments
