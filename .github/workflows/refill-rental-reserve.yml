name: Refill rental reserve every two hours
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refill-rental-reserve
  cancel-in-progress: false
jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_ID: '-1004389602150'
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      LALAFO_PROXY_URL: ${{ secrets.LALAFO_PROXY_URL }}
      FORCE_DISCOVERY: 'true'
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect fresh Telegram reserve
        continue-on-error: true
        run: python -m scripts.collect_telegram_inventory
      - name: Search Lalafo and refill durable queue
        continue-on-error: true
        run: python -m scripts.collect_lalafo_inventory
      - name: Measure six-hour reserve
        run: python -m tools.rental_reserve_status
