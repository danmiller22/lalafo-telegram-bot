name: Send customer refund notice by name once

on:
  workflow_dispatch:
    inputs:
      target_name_hashes:
        description: Comma-separated SHA-256 hashes of normalized display names
        required: true

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CUSTOMER_NOTICE_NAME_HASHES: ${{ inputs.target_name_hashes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Resolve exact profiles and send approved notice
        run: python -m scripts.send_customer_refund_notice_by_name_once
