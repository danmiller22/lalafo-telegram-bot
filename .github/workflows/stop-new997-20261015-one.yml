name: Stop new-account one VIP cohort after one day
on:
  workflow_dispatch:
    inputs:
      verify_only:
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: requested-lalafo-expiry-new997-20261015-one
  cancel-in-progress: false
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      CAMPAIGN_SESSION_KEY_NAME: requested_campaign_expiry_key_20261015_new997_one
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify or stop only these exact three owned campaigns
        env:
          VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only }}
        run: |
          if [ "$VERIFY_ONLY" = "true" ]; then
            python -m tools.stop_lalafo_campaigns --plan tools/lalafo_campaigns_20261015_new997_one.json --verify-only
          else
            python -m tools.stop_lalafo_campaigns --plan tools/lalafo_campaigns_20261015_new997_one.json
          fi
