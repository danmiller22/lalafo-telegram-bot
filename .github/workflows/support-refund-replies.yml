name: Check Telegram support complaints
on:
  workflow_dispatch:
  schedule:
    - cron: '19 */3 * * *'
permissions:
  contents: read
concurrency:
  group: support-refund-replies
  cancel-in-progress: false
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.support_refund_replies
