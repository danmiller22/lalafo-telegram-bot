name: Private encrypted payment customer export

on:
  workflow_dispatch:
    inputs:
      public_key_b64:
        description: One-time RSA public key in base64 PEM form
        required: true
      target_phone_hashes:
        description: Comma-separated SHA-256 hashes of normalized target phones
        required: false
      requests_only:
        description: Export payment requests without receipt OCR
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUDIT_PUBLIC_KEY_B64: ${{ inputs.public_key_b64 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      AUDIT_TARGET_PHONE_HASHES: ${{ inputs.target_phone_hashes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: command -v tesseract >/dev/null || (sudo apt-get update && sudo apt-get install -y tesseract-ocr)
      - name: Create encrypted audit artifact
        run: |
          if [ "${{ inputs.requests_only }}" = "true" ]; then
            python -m scripts.private_payment_request_users_export
          else
            python -m scripts.private_payment_customer_export
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: private-payment-customers
          path: private-payment-customers.enc.json
          retention-days: 1
