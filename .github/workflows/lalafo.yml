name: Lalafo scraper

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      run_scraper:
        description: Run Lalafo scraper after tests and migrations
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: lalafo-scraper
  cancel-in-progress: false

jobs:
  scrape:
    # Lalafo rejects GitHub-hosted IP ranges. Scheduled scraping stays disabled
    # until an allowed self-hosted runner is connected and SCRAPER_ENABLED=true.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SCRAPER_ENABLED == 'true' }}
    runs-on: ${{ vars.SCRAPER_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_ID: ${{ vars.TELEGRAM_GROUP_ID || '-1004389602150' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
      ADMIN_USERNAME: maxkgz2
      SUPPORT_URL: https://t.me/maxkgz2
      FINIK_PAYMENT_URL: https://qr.finik.kg/e4a0a0da-51b8-42f5-8537-aa4c9403aad6
      LALAFO_SEARCH_URL: https://lalafo.kg/bishkek/kvartiry/arenda-kvartir/dolgosrochnaya-arenda-kvartir/1-bedroom/2-bedrooms/studio/owner/real-estate-agency/bez-podseleniya?price[to]=35000
      MAX_PRICE: "35000"
      MAX_NEW_POSTS_PER_RUN: "10"
      MAX_PHOTOS_PER_APARTMENT: "5"
      DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
      TEST_MODE: ${{ vars.TEST_MODE || 'true' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Apply database migrations
        if: ${{ env.DATABASE_URL != '' }}
        run: alembic upgrade head
      - name: Scrape and publish
        if: ${{ github.event_name == 'schedule' || inputs.run_scraper }}
        run: python -m scripts.scrape_publish
      - name: Commit updated deduplication state
        if: ${{ (github.event_name == 'schedule' || inputs.run_scraper) && env.DRY_RUN != 'true' }}
        shell: bash
        run: |
          if git diff --quiet -- data/posted_ads.json; then
            echo "State unchanged; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted_ads.json
          git commit -m "chore: update posted apartment state"
          git pull --rebase origin main
          git push origin HEAD:main


