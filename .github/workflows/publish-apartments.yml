name: Publish apartments to Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: read

concurrency:
  group: publish-apartments
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_ID: "-1004389602150"
      ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DRY_RUN: "false"
      TEST_MODE: "false"
      MAX_NEW_POSTS_PER_RUN: "80"
      ALLOW_NO_DISTRICT: "false"
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Select a working Lalafo proxy
        run: python -m scripts.select_lalafo_proxy >> "$GITHUB_ENV"
      - run: alembic upgrade head
      - name: Publish up to 80 new apartments
        run: python -m scripts.scrape_publish
      - name: Refresh buttons on published cards
        if: success()
        run: python -m scripts.sync_published_keyboards
