name: Process featured review bot choices

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: featured-review-updates
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FEATURED_REVIEW_BOT_TOKEN: ${{ secrets.FEATURED_REVIEW_BOT_TOKEN }}
      ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FEATURED_REVIEW_ENABLED: ${{ vars.FEATURED_REVIEW_ENABLED || 'false' }}
      FEATURED_LALAFO_ENABLED: ${{ vars.FEATURED_LALAFO_ENABLED || 'false' }}
      LALAFO_PROXY_URL: ${{ vars.LALAFO_PROXY_URL || '' }}
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m scripts.process_featured_review_updates
