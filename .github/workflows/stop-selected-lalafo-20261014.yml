name: Stop these five one-day VIP campaigns
on:
  workflow_dispatch:
    inputs:
      verify_only:
        type: boolean
        default: true
  schedule:
    - cron: '20,25,30,35,40,45,50,55 23 15 10 *'
permissions:
  contents: read
concurrency:
  group: requested-lalafo-expiry-20261014
  cancel-in-progress: false
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      CAMPAIGN_SESSION_KEY_NAME: requested_campaign_expiry_key_20261014
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify or stop only these exact five owned campaigns
        env:
          VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only }}
        run: |
          if [ "$VERIFY_ONLY" = "true" ]; then
            python -m tools.stop_lalafo_campaigns --plan tools/lalafo_campaigns_20261014.json --verify-only
          else
            python -m tools.stop_lalafo_campaigns --plan tools/lalafo_campaigns_20261014.json
          fi
