name: Publish approved featured apartments

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-featured-lalafo
  cancel-in-progress: false

jobs:
  publish-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_ID: "-1004389602150"
      ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LALAFO_LOGIN: ${{ secrets.LALAFO_LOGIN }}
      LALAFO_PASSWORD: ${{ secrets.LALAFO_PASSWORD }}
      FEATURED_LALAFO_ENABLED: ${{ vars.FEATURED_LALAFO_ENABLED || 'false' }}
      FEATURED_PUBLISH_APPROVED_ENABLED: ${{ vars.FEATURED_PUBLISH_APPROVED_ENABLED || 'false' }}
      FEATURED_AUTOPROMOTE_ENABLED: ${{ vars.FEATURED_AUTOPROMOTE_ENABLED || 'false' }}
      DRY_RUN: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m scripts.publish_featured_lalafo
