name: Remove availability wording from recorded public cards
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-card-caption-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_ID: '-1004389602150'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tools.remove_card_availability
