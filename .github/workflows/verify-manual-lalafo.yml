name: Verify manual bot without sending messages

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Lalafo URL for a read-only cloud fetch (never published)
        default: https://lalafo.kg/bishkek/ads/kvartira-id-116352866
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      LALAFO_BOT_TOKEN: ${{ secrets.LALAFO_BOT_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SOURCE_URL: ${{ inputs.source_url }}
    steps:
      - name: Check HTTP, Telegram APIs, group membership, and Lalafo loading
        shell: python
        run: |
          import json, os, time, urllib.request, urllib.error
          def fetch(url, data=None, headers=None):
              req = urllib.request.Request(url, headers=headers or {},
                  data=json.dumps(data).encode() if data is not None else None)
              try:
                  with urllib.request.urlopen(req, timeout=65) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.loads(e.read())
                  except ValueError:
                      return e.code, {'error': 'HTTPError'}
          def telegram(token, method):
              return fetch('https://api.telegram.org/bot' + token + '/' + method)[1]
          base = 'https://arenda-lalafo-manual.onrender.com'
          ready = False
          for attempt in range(12):
              try:
                  status, health = fetch(base + '/health')
                  if status == 200 and health.get('worker') == 'running':
                      print('Manual service:', status, health)
                      ready = True
                      break
              except Exception as exc:
                  print('Waiting for service:', type(exc).__name__)
              time.sleep(10)
          assert ready, 'Manual service is not ready'
          for name in ['TELEGRAM_BOT_TOKEN', 'LALAFO_BOT_TOKEN']:
              token = os.environ[name]
              me = telegram(token, 'getMe')
              hook = telegram(token, 'getWebhookInfo')
              result = hook.get('result', {})
              print('Telegram:', me.get('result', {}).get('username'),
                    'webhook=', result.get('url'), 'pending=', result.get('pending_update_count'),
                    'last_error_date=', result.get('last_error_date'),
                    'last_error=', result.get('last_error_message'))
          group = telegram(os.environ['LALAFO_BOT_TOKEN'], 'getChatMember?chat_id=-1004389602150&user_id=8911032573')
          print('Group membership:', group.get('ok'), group.get('result', {}).get('status'), group.get('description'))
          status, env = fetch('https://api.render.com/v1/services/srv-damule2jnfac73engc8g/env-vars',
              headers={'Authorization': 'Bearer ' + os.environ['RENDER_API_KEY']})
          assert status == 200, 'Could not read diagnostic configuration'
          values = {item['envVar']['key']: item['envVar']['value'] for item in env}
          status, detail = fetch(base + '/diagnostics/lalafo', data={'url': os.environ['SOURCE_URL']},
              headers={'Content-Type': 'application/json', 'X-Lalafo-Diagnostic-Secret': values['LALAFO_WEBHOOK_SECRET']})
          print('Read-only Lalafo fetch:', status, detail)
          assert group.get('ok'), 'Add @personn22bot to the publishing group'
          assert status == 200 and detail.get('has_phone') and detail.get('photo_count', 0) >= 2, 'Listing could not be loaded completely'
