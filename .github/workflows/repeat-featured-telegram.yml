name: Repeat daily featured Telegram cards

on:
  workflow_dispatch:
  schedule:
    - cron: "35 */2 * * *"

permissions:
  contents: read

concurrency:
  group: featured-telegram-repeat
  cancel-in-progress: false

jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_ID: "-1004389602150"
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FEATURED_LALAFO_ENABLED: ${{ vars.FEATURED_LALAFO_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m scripts.repeat_featured_telegram
