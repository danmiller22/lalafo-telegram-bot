name: Stop renewed one-day Lalafo promotions

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify account and exact campaign ownership without stopping promotions
        type: boolean
        default: true
  schedule:
    # Starts early with retries; confirmed completion prevents later account access.
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 23 14 10 *"

permissions:
  contents: read

concurrency:
  group: requested-lalafo-promotion-expiry-20261013
  cancel-in-progress: false

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LALAFO_LOGIN: ${{ secrets.LALAFO_LOGIN }}
      LALAFO_PASSWORD: ${{ secrets.LALAFO_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      CAMPAIGN_SESSION_KEY_NAME: requested_campaign_expiry_key_20261013
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify or stop only the authorized campaigns
        env:
          VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only }}
        run: |
          if [ "$VERIFY_ONLY" = "true" ]; then
            python -m tools.stop_lalafo_campaigns --plan tools/lalafo_campaigns_20261013.json --verify-only
          else
            python -m tools.stop_lalafo_campaigns --plan tools/lalafo_campaigns_20261013.json
          fi
