name: Send customer refund notice once

on:
  workflow_dispatch:
    inputs:
      target_id_hashes:
        description: Comma-separated SHA-256 hashes of paid Telegram user IDs
        required: true

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CUSTOMER_NOTICE_TARGET_HASHES: ${{ inputs.target_id_hashes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send approved notice and record receipts
        run: python -m scripts.send_customer_refund_notice_once
