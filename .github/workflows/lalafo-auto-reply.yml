name: Hourly Lalafo greeting

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read

concurrency:
  group: lalafo-hourly-greeting
  cancel-in-progress: true

jobs:
  responder:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      LALAFO_EXPECTED_OWNER_ID: "18209276"
      LALAFO_SESSION_ENVELOPE: "tools/lalafo_hourly_session_20261024.json"
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check --quiet -r requirements.txt
      - name: Reply once to new conversations
        run: python -m scripts.lalafo_reply_unanswered_once
