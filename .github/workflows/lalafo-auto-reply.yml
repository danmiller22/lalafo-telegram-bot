name: Lalafo greeting every 30 minutes

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify account and chat access without sending replies
        type: boolean
        default: true
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: lalafo-half-hour-greeting-18225388
  cancel-in-progress: false

jobs:
  responder:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      LALAFO_PROXY_URL: ${{ secrets.LALAFO_PROXY_URL }}
      LALAFO_EXPECTED_OWNER_ID: "18225388"
      LALAFO_SESSION_ENVELOPE: "tools/lalafo_half_hour_session_18225388.json"
      LALAFO_GREETING_SINCE: "2026-11-07T08:52:34Z"
      LALAFO_GREETING_VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only }}
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check --quiet -r requirements.txt
      - name: Verify duplicate protection and new-message selection
        run: python -m pytest tests/test_lalafo_greeting_once.py tests/test_lalafo_auto_reply.py -q
      - name: Monitor new conversations and reply once
        run: python -m scripts.lalafo_reply_unanswered_once
      - name: Diagnose the existing hosted chat route after a failed preflight
        if: failure()
        run: |
          python - <<'PYCODE'
          import os,httpx,json
          response=httpx.post('https://statutory-mallissa-2danmiller-f1c1b08d.koyeb.app/internal/lalafo/auto-reply-preflight',headers={'Authorization':'Bearer '+os.environ['CALLBACK_SECRET']},timeout=55)
          try:
              data=response.json()
          except ValueError:
              data={}
          print(json.dumps({'hosted_http_status':response.status_code,**{k:data[k] for k in ['status','error','owner_verified','chats_readable','socket_ready'] if k in data}}))
          PYCODE
