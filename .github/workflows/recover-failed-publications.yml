name: Recover definite media and shared publication failures once
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-apartments
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_ID: '-1004389602150'
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      LALAFO_PROXY_URL: ${{ secrets.LALAFO_PROXY_URL }}
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tools.recover_failed_publications
      - run: python -m scripts.publish_if_due
      - run: python -m tools.rental_reserve_status
