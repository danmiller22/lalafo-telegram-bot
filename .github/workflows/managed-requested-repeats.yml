name: Publish Telegram queue and managed apartment repeats
on:
  push:
    branches: [main]
    paths: ['.github/workflows/managed-requested-repeats.yml']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      managed_only:
        description: Publish only due current-account Lalafo cards
        type: boolean
        default: false
      managed_batch_size:
        description: Number of due managed cards to send in this manual run
        type: choice
        options: ['1', '2', '5']
        default: '1'
      manifest:
        type: string
        default: ''
      confirm_enrollment:
        type: boolean
        default: false
      publish_all_now:
        description: Send this explicitly requested verified owned batch now and enroll 3h repeats
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: managed-requested-telegram
  cancel-in-progress: false
jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      LALAFO_PROXY_URL: ${{ secrets.LALAFO_PROXY_URL }}
      TELEGRAM_GROUP_ID: '-1004389602150'
      QUEUE_RESERVATION_ALL_CARDS: ${{ github.event_name == 'push' && 'false' || (inputs.managed_only && 'false' || 'true') }}
      MANAGED_REPEAT_MANIFEST: ${{ inputs.manifest }}
      CONFIRM_MANAGED_REPEATS: ${{ inputs.confirm_enrollment && 'true' || 'false' }}
      MANAGED_BATCH_SIZE: ${{ github.event_name == 'push' && '2' || (inputs.managed_only && inputs.managed_batch_size || '1') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Store verified originals for the explicitly requested batch
        if: inputs.publish_all_now && inputs.confirm_enrollment
        env:
          CONFIRM_OWNED_SOURCE_SEED: 'true'
        run: python -m tools.seed_owned_manifest_sources --manifest "$MANAGED_REPEAT_MANIFEST"
      - name: Publish the explicitly requested owned batch
        if: inputs.publish_all_now && inputs.confirm_enrollment
        env:
          CONFIRM_OWNED_PUBLIC_SEND: 'true'
        run: python -m tools.publish_owned_requested_cards --manifest "$MANAGED_REPEAT_MANIFEST"
      - name: Select the existing public Lalafo route
        if: ${{ !inputs.publish_all_now }}
        shell: bash
        run: |
          if python -m scripts.select_lalafo_proxy > lalafo-route.env; then
            while IFS= read -r entry; do
              echo "::add-mask::${entry#LALAFO_PROXY_URL=}"
            done < lalafo-route.env
            cat lalafo-route.env >> "$GITHUB_ENV"
          fi
      - name: Publish requested batch within the shared queue limits
        if: ${{ !inputs.publish_all_now }}
        shell: bash
        run: |
          delivered=0
          for attempt in $(seq 1 15); do
            python -m scripts.managed_requested_repeats | tee /tmp/managed-delivery.log
            if grep -q '^QUEUE_CARD_PUBLISHED ' /tmp/managed-delivery.log; then
              delivered=$((delivered + 1))
            fi
            if [ "$delivered" -ge "$MANAGED_BATCH_SIZE" ]; then break; fi
            if [ "$MANAGED_BATCH_SIZE" = 1 ]; then break; fi
            sleep 30
          done
          echo "MANAGED_BATCH_DELIVERED=$delivered/$MANAGED_BATCH_SIZE"
          if [ "$MANAGED_BATCH_SIZE" != 1 ] && [ "$delivered" -lt "$MANAGED_BATCH_SIZE" ]; then
            exit 1
          fi
