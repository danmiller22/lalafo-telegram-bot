name: Disable legacy hosted VIP watchers
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: disable-legacy-vip-watchers
  cancel-in-progress: false
jobs:
  disable-watchers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tools.disable_legacy_vip_watchers
