name: Publish Telegram queue and managed apartment repeats
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      managed_only:
        description: Publish only due current-account Lalafo cards
        type: boolean
        default: false
      manifest:
        type: string
        default: ''
      confirm_enrollment:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: managed-requested-telegram
  cancel-in-progress: false
jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
      LALAFO_PROXY_URL: ${{ secrets.LALAFO_PROXY_URL }}
      TELEGRAM_GROUP_ID: '-1004389602150'
      QUEUE_RESERVATION_ALL_CARDS: ${{ inputs.managed_only && 'false' || 'true' }}
      MANAGED_REPEAT_MANIFEST: ${{ inputs.manifest }}
      CONFIRM_MANAGED_REPEATS: ${{ inputs.confirm_enrollment && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Select the existing public Lalafo route
        shell: bash
        run: |
          if python -m scripts.select_lalafo_proxy > lalafo-route.env; then
            while IFS= read -r entry; do
              echo "::add-mask::${entry#LALAFO_PROXY_URL=}"
            done < lalafo-route.env
            cat lalafo-route.env >> "$GITHUB_ENV"
          fi
      - run: python -m scripts.managed_requested_repeats
