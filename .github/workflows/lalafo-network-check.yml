name: Lalafo cloud network check

on:
  workflow_dispatch:
    inputs:
      collect_inventory:
        description: Collect into the shared inventory without publishing messages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      LALAFO_PROXY_URL: ${{ secrets.LALAFO_PROXY_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Select verified route without exposing credentials
        run: |
          python -m scripts.select_lalafo_proxy > lalafo-route.env
          while IFS= read -r entry; do
            echo "::add-mask::${entry#LALAFO_PROXY_URL=}"
          done < lalafo-route.env
          cat lalafo-route.env >> "$GITHUB_ENV"
      - name: Verify actual public search and matching detail access
        run: |
          python - <<'PY'
          import asyncio, json, os
          from app.config import INVENTORY_SEARCH_URLS
          from app.lalafo.client import LalafoClient

          async def main():
              verified = 0
              async with LalafoClient(timeout=12, max_retries=3, proxy_url=os.getenv("LALAFO_PROXY_URL", "")) as client:
                  for index, url in enumerate(INVENTORY_SEARCH_URLS[:3]):
                      try:
                          page = await client.search(url)
                          if not page.items:
                              print(json.dumps({"source": index, "items": 0, "detail_verified": False}))
                              continue
                          source = page.items[0]
                          detail = await client.detail(source.detail_url)
                          assert detail.lalafo_id == source.lalafo_id
                          verified += 1
                          print(json.dumps({"source": index, "items": len(page.items), "detail_verified": True, "phone_present": bool(detail.phone)}))
                      except Exception as exc:
                          print(json.dumps({"source": index, "error": type(exc).__name__, "http_status": getattr(exc, "status_code", None)}))
              if not verified:
                  raise SystemExit("No working public Lalafo search/detail route")
          asyncio.run(main())
          PY
      - name: Verify collection into the shared inventory
        if: inputs.collect_inventory
        timeout-minutes: 13
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          verify_collection() {
            python - <<'PY'
          import json
          from pathlib import Path
          from scripts.collect_lalafo_inventory import REPORT_PREFIX
          reports = [json.loads(line.removeprefix(REPORT_PREFIX))
                     for line in Path("lalafo-collection.log").read_text().splitlines()
                     if line.startswith(REPORT_PREFIX)]
          if not reports or reports[-1].get("status") != "collected" or not reports[-1].get("search_pages"):
              raise SystemExit("Collection was skipped or failed; actual inventory collection is not verified")
          PY
          }
          for attempt in 1 2 3 4 5; do
            python -m scripts.collect_lalafo_inventory | tee lalafo-collection.log
            if verify_collection; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 30
            fi
          done
          exit 3
