name: Lalafo cloud network check

on:
  workflow_dispatch:
    inputs:
      verified_campaign_plan:
        type: string
        default: tools/lalafo_campaigns_20261014.json
      verify_selected_campaigns:
        type: boolean
        default: false
      selected_promotion_ids:
        type: string
        default: ''
        description: Explicit source IDs whose recent acknowledged cards get this one-day request
      requested_batch_manifest:
        description: Repository manifest of the verified owned ads for this batch
        type: string
        default: tools/lalafo_requested_batch_20261014.json
      selected_promotion_batch_key:
        type: string
        default: ''
      runtime_diagnostics:
        description: Read-only source, publication, repeat and outbox diagnostics
        type: boolean
        default: false
      register_requested_promotions:
        description: Register the five explicitly requested cards for three sends within 24 hours
        type: boolean
        default: false
      campaign_session_key_name:
        description: Scoped storage key for the requested campaign expiry
        type: string
        default: requested_campaign_expiry_key_20261012
      hosted_campaign_storage:
        description: Rewrap only the current five-campaign transfer for the hosted timer
        type: boolean
        default: false
      prepare_campaign_session_key:
        description: Prepare encrypted session transfer key for the requested campaign cutoff
        type: boolean
        default: false
      verify_renewed_campaign_access:
        description: Verify the eight explicitly renewed campaigns without cancelling
        type: boolean
        default: false
      verify_campaign_access:
        description: Verify credentials and ownership of the requested one-day campaigns without cancelling
        type: boolean
        default: false
      requested_listing_snapshot:
        description: Read public evidence for the explicitly requested East-5 republication
        type: boolean
        default: false
      audit_duplicates:
        description: Read-only audit of recent publication photo overlap
        type: boolean
        default: false
      collect_telegram_inventory:
        description: Collect the configured Telegram sources without publishing messages
        type: boolean
        default: false
      force_inventory_collection:
        description: Retry the requested collection now while respecting an active collector lease
        type: boolean
        default: false
      collect_inventory:
        description: Collect into the shared inventory without publishing messages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      LALAFO_PROXY_URL: ${{ secrets.LALAFO_PROXY_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Register only this explicit requested batch from actual receipts
        if: inputs.selected_promotion_ids != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SELECTED_PROMOTION_IDS: ${{ inputs.selected_promotion_ids }}
          SELECTED_PROMOTION_BATCH_KEY: ${{ inputs.selected_promotion_batch_key }}
          REQUESTED_BATCH_MANIFEST: ${{ inputs.requested_batch_manifest }}
        run: |
          python -m tools.register_selected_requested_cards
          python -m tools.register_selected_requested_cards --apply
          python -m tools.link_requested_lalafo_cards --manifest "$REQUESTED_BATCH_MANIFEST"
      - name: Verify these exact five VIP campaigns without cancellation or payment
        if: inputs.verify_selected_campaigns
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          VERIFIED_CAMPAIGN_PLAN: ${{ inputs.verified_campaign_plan }}
        run: python -m tools.stop_lalafo_campaigns --plan "$VERIFIED_CAMPAIGN_PLAN" --verify-only
      - name: Read shared runtime counters without sending messages or changing data
        if: inputs.runtime_diagnostics
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m tools.runtime_diagnostics
      - name: Register requested Telegram cards using actual publication receipts
        if: inputs.register_requested_promotions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          alembic upgrade head
          python -m tools.register_requested_promotions
          python -m tools.register_requested_promotions --apply
      - name: Prepare only the session transfer public key
        if: inputs.prepare_campaign_session_key
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          CAMPAIGN_SESSION_KEY_NAME: ${{ inputs.campaign_session_key_name }}
          HOSTED_CAMPAIGN_STORAGE: ${{ inputs.hosted_campaign_storage }}
        run: |
          if [ "$HOSTED_CAMPAIGN_STORAGE" = "true" ]; then
            python -m tools.lalafo_campaign_session --rewrap-for-hosted
          else
            python -m tools.lalafo_campaign_session --prepare-key
          fi
      - name: Verify account access without modifying advertisements or promotions
        if: inputs.verify_campaign_access
        env:
          LALAFO_LOGIN: ${{ secrets.LALAFO_LOGIN }}
          LALAFO_PASSWORD: ${{ secrets.LALAFO_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: python -m tools.stop_lalafo_campaigns --verify-only
      - name: Verify renewed campaign access without account changes
        if: inputs.verify_renewed_campaign_access
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          CAMPAIGN_SESSION_KEY_NAME: requested_campaign_expiry_key_20261013
        run: python -m tools.stop_lalafo_campaigns --plan tools/lalafo_campaigns_20261013.json --verify-only
      - name: Read requested public listing snapshot
        if: inputs.requested_listing_snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m tools.requested_listing_snapshot
      - name: Audit recent publication duplicates without changing the channel
        if: inputs.audit_duplicates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m tools.audit_publication_duplicates
      - name: Select verified route without exposing credentials
        if: ${{ !inputs.verify_campaign_access && !inputs.prepare_campaign_session_key && !inputs.audit_duplicates && !inputs.requested_listing_snapshot && !inputs.verify_renewed_campaign_access && !inputs.register_requested_promotions && !inputs.runtime_diagnostics && !inputs.selected_promotion_ids && !inputs.verify_selected_campaigns }}
        run: |
          python -m scripts.select_lalafo_proxy > lalafo-route.env
          while IFS= read -r entry; do
            echo "::add-mask::${entry#LALAFO_PROXY_URL=}"
          done < lalafo-route.env
          cat lalafo-route.env >> "$GITHUB_ENV"
      - name: Verify actual public search and matching detail access
        if: ${{ !inputs.verify_campaign_access && !inputs.prepare_campaign_session_key && !inputs.audit_duplicates && !inputs.requested_listing_snapshot && !inputs.verify_renewed_campaign_access && !inputs.register_requested_promotions && !inputs.runtime_diagnostics && !inputs.selected_promotion_ids && !inputs.verify_selected_campaigns }}
        run: |
          python - <<'PY'
          import asyncio, json, os
          from app.config import INVENTORY_SEARCH_URLS
          from app.lalafo.client import LalafoClient

          async def main():
              verified = 0
              async with LalafoClient(timeout=12, max_retries=3, proxy_url=os.getenv("LALAFO_PROXY_URL", "")) as client:
                  for index, url in enumerate(INVENTORY_SEARCH_URLS[:4]):
                      try:
                          page = await client.search(url)
                          if not page.items:
                              print(json.dumps({"source": index, "items": 0, "detail_verified": False}))
                              continue
                          source = page.items[0]
                          detail = await client.detail(source.detail_url)
                          assert detail.lalafo_id == source.lalafo_id
                          verified += 1
                          print(json.dumps({"source": index, "items": len(page.items), "detail_verified": True, "phone_present": bool(detail.phone), "seller_type": detail.seller_type}))
                      except Exception as exc:
                          print(json.dumps({"source": index, "error": type(exc).__name__, "http_status": getattr(exc, "status_code", None)}))
              if not verified:
                  raise SystemExit("No working public Lalafo search/detail route")
          asyncio.run(main())
          PY
      - name: Collect expanded Telegram sources without publishing
        if: inputs.collect_telegram_inventory
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.collect_telegram_inventory
      - name: Verify collection into the shared inventory
        if: inputs.collect_inventory
        timeout-minutes: 13
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE_DISCOVERY: ${{ inputs.force_inventory_collection }}
        shell: bash
        run: |
          verify_collection() {
            python - <<'PY'
          import json
          from pathlib import Path
          from scripts.collect_lalafo_inventory import REPORT_PREFIX
          reports = [json.loads(line.removeprefix(REPORT_PREFIX))
                     for line in Path("lalafo-collection.log").read_text().splitlines()
                     if line.startswith(REPORT_PREFIX)]
          if not reports or reports[-1].get("status") != "collected" or not reports[-1].get("search_pages"):
              raise SystemExit("Collection was skipped or failed; actual inventory collection is not verified")
          PY
          }
          for attempt in 1 2 3 4 5; do
            python -m scripts.collect_lalafo_inventory | tee lalafo-collection.log
            if verify_collection; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 30
            fi
          done
          exit 3
