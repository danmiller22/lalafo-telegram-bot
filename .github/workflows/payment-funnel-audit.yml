name: Audit aggregate payment funnel

on:
  workflow_dispatch:
    inputs:
      timezone:
        description: IANA timezone used for today and yesterday
        required: false
        default: Asia/Bishkek

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PAYMENT_AUDIT_TIMEZONE: ${{ inputs.timezone }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Print aggregate funnel only
        run: python -m scripts.payment_funnel_audit
