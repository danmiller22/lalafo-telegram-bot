name: Audit aggregate payment funnel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Print aggregate funnel only
        run: python -m tools.audit_evening_payments > payment-evening-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: payment-evening-audit
          path: payment-evening-audit.json
          retention-days: 3
