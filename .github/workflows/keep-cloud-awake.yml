name: Keep cloud auto-reply awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake free cloud service
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 https://statutory-mallissa-2danmiller-f1c1b08d.koyeb.app/health
