version: v1.0
name: Featured review bot updates

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

execution_time_limit:
  minutes: 20

global_job_config:
  env_vars:
    - name: FEATURED_REVIEW_ENABLED
      value: "true"
    - name: FEATURED_LALAFO_ENABLED
      value: "true"
    - name: FEATURED_PUBLISH_APPROVED_ENABLED
      value: "true"
    - name: FEATURED_AUTOPROMOTE_ENABLED
      value: "false"
    - name: LOG_LEVEL
      value: "INFO"

blocks:
  - name: Manual-link webhook mode
    task:
      jobs:
        - name: Legacy polling retired
          commands:
            - echo "Telegram webhook handles manual Lalafo links immediately"
