version: v1.0
name: Lalafo auto-reply health check

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

execution_time_limit:
  minutes: 2

blocks:
  - name: Verify the single hosted responder
    task:
      jobs:
        - name: Do not start a second Lalafo login session
          commands:
            - curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 20 https://statutory-mallissa-2danmiller-f1c1b08d.koyeb.app/health
