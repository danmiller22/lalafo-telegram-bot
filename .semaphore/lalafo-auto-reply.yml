version: v1.0
name: Lalafo automatic replies

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

execution_time_limit:
  minutes: 5

blocks:
  - name: Answer new Lalafo messages
    task:
      secrets:
        - name: lalafo-production
      jobs:
        - name: Send the fixed Telegram invitation
          commands:
            - checkout
            - sem-version python 3.12
            - python -m pip install --disable-pip-version-check --quiet 'beautifulsoup4>=4.13,<5' 'httpx>=0.28,<1' 'python-socketio[asyncio_client]>=5.13,<6'
            - python -m scripts.lalafo_auto_reply_once
