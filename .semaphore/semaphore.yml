version: v1.0
name: Lalafo safe cloud run

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

execution_time_limit:
  minutes: 10

global_job_config:
  env_vars:
    - name: DRY_RUN
      value: "true"
    - name: TEST_MODE
      value: "true"
    - name: LOG_LEVEL
      value: "INFO"

blocks:
  - name: Lalafo dry run
    task:
      jobs:
        - name: Scrape without publishing
          commands:
            - checkout
            - sem-version python 3.12
            - python --version
            - python -m pip install -r requirements.txt
            - python -m scripts.scrape_publish
            - curl --fail --silent --show-error --retry 3 --retry-delay 5 https://statutory-mallissa-2danmiller-f1c1b08d.koyeb.app/health
