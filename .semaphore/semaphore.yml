version: v1.0
name: Lalafo safe cloud run

agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2204

execution_time_limit:
  minutes: 10

global_job_config:
  env_vars:
    - name: DRY_RUN
      value: "true"
    - name: TEST_MODE
      value: "true"
    - name: LOG_LEVEL
      value: "INFO"

blocks:
  - name: Lalafo dry run
    task:
      jobs:
        - name: Scrape without publishing
          commands:
            - checkout
            - docker run --rm -e DRY_RUN -e TEST_MODE -e LOG_LEVEL -v "$PWD:/app" -w /app python:3.12-bookworm sh -lc "pip install -r requirements.txt && python -m scripts.scrape_publish"
            - curl --fail --silent --show-error --retry 3 --retry-delay 5 https://statutory-mallissa-2danmiller-f1c1b08d.koyeb.app/health
