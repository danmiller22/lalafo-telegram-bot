version: v1.0
name: Featured Lalafo review shortlist

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

execution_time_limit:
  minutes: 20

global_job_config:
  env_vars:
    - name: FEATURED_LALAFO_ENABLED
      value: "true"
    - name: FEATURED_REVIEW_ENABLED
      value: "true"
    - name: FEATURED_PUBLISH_APPROVED_ENABLED
      value: "false"
    - name: FEATURED_AUTOPROMOTE_ENABLED
      value: "false"
    - name: DRY_RUN
      value: "false"

blocks:
  - name: Send isolated review shortlist
    task:
      secrets:
        - name: lalafo-production
        - name: featured-review
      jobs:
        - name: Find candidates and ask the admin
          commands:
            - checkout
            - sem-version python 3.12
            - python --version
            - python -m pip install -r requirements.txt
            - alembic upgrade head
            - python -m scripts.suggest_featured_lalafo
