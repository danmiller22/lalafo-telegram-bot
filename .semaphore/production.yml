version: v1.0
name: Lalafo production cloud run

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

execution_time_limit:
  minutes: 10

blocks:
  - name: Publish new apartments
    task:
      secrets:
        - name: lalafo-production
      jobs:
        - name: Scrape, deduplicate and publish
          commands:
            - checkout
            - sem-version python 3.12
            - python --version
            - python -m pip install -r requirements.txt
            - alembic upgrade head
            - python -m scripts.scrape_publish
            - curl --fail --silent --show-error --retry 3 --retry-delay 5 https://statutory-mallissa-2danmiller-f1c1b08d.koyeb.app/health
